<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <title>Dashboard</title>
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4a8"/>
      <stop offset="100%" stop-color="#1fb98f"/>
    </linearGradient>
  </defs>

  <!-- Teal rounded-square badge background -->
  <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#badgeGrad)"/>

  <!-- Top-left: small square cutout -->
  <rect x="16" y="16" width="20" height="20" rx="4" fill="#0a1929"/>

  <!-- Top-right: tall rectangle cutout -->
  <rect x="44" y="16" width="20" height="34" rx="4" fill="#0a1929"/>

  <!-- Bottom-left: small square cutout -->
  <rect x="16" y="44" width="20" height="20" rx="4" fill="#0a1929"/>

  <!-- Bottom-right: thin bar cutout -->
  <rect x="44" y="58" width="20" height="6" rx="3" fill="#0a1929"/>
</svg>
